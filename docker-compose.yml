name: de-lab

services:
  # Workspace: Jupyter (8888) + Airflow (8080) + Spark
  lab:
    build: .
    image: de-lab:py313
    env_file:
      - path: .env              # PG_* (local PostgreSQL), MONGO_URI, SERVICES
        required: false
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-db:5432/${AIRFLOW_DB_NAME:-airflow}
    ports:
      - "8888:8888"   # JupyterLab
      - "8080:8080"   # Airflow
      - "4040:4040"   # Spark UI
    volumes:
      - ./dags:/opt/airflow/dags            # Map the local dags folder into the Airflow container
      - airflow-logs:/opt/airflow/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Allow connecting to a PostgreSQL instance on the host
    depends_on:
      airflow-db:
        condition: service_healthy
    mem_limit: 3g
    restart: unless-stopped

  # Airflow's internal metadata database (run history, task status). Not used for the pipeline data.
  airflow-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  airflow-db-data:
  airflow-logs: